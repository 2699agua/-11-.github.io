<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的博客实验版本</title>试试看呢
    <!-- 柔和的现代风格，完全开源，可自由使用 -->
    <style>
        /* 全局重置与设计变量 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-start: #f6f9fc;
            --bg-end: #e6f0f5;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #1a2e3b;
            --text-secondary: #2c4a5e;
            --accent: #2a7f6e;
            --accent-soft: #3e9e8c;
            --border-light: rgba(42, 127, 110, 0.15);
            --shadow-sm: 0 8px 20px -6px rgba(0, 30, 20, 0.1), 0 4px 12px -2px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 20px 30px -12px rgba(26, 74, 58, 0.2);
            --radius-lg: 2.5rem;
            --radius-md: 1.25rem;
            --radius-sm: 0.75rem;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            line-height: 1.5;
            color: var(--text-primary);
        }

        /* 主卡片——开源项目展示区 */
        .open-source-card {
            max-width: 900px;
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 3rem 2.5rem;
            transition: box-shadow 0.3s ease, transform 0.2s ease;
        }

        .open-source-card:hover {
            box-shadow: var(--shadow-hover);
            transform: scale(1.003);
        }

        /* 顶部装饰 + 徽章 */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(42, 127, 110, 0.08);
            border: 1px solid var(--border-light);
            padding: 0.4rem 1rem 0.4rem 0.8rem;
            border-radius: 100px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--accent);
            text-transform: uppercase;
            backdrop-filter: blur(4px);
        }

        .badge svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .stars {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: #f5b342;
            font-weight: 500;
            background: rgba(245, 179, 66, 0.1);
            padding: 0.3rem 0.9rem;
            border-radius: 100px;
            font-size: 0.9rem;
            border: 1px solid rgba(245, 179, 66, 0.2);
        }

        .stars span {
            color: var(--text-secondary);
            font-weight: 400;
            margin-left: 0.2rem;
        }

        /* 主标题 */
        .title-section {
            margin-bottom: 2.5rem;
        }

        .title-section h1 {
            font-size: clamp(2.2rem, 7vw, 3.5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            line-height: 1.2;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .title-section h1 .accent-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            margin-right: 0.2rem;
            box-shadow: 0 0 0 4px rgba(42, 127, 110, 0.15);
        }

        .subhead {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 400;
            max-width: 600px;
            margin-top: 0.5rem;
            border-left: 3px solid var(--accent-soft);
            padding-left: 1.2rem;
        }

        /* 特性网格 */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin: 2.5rem 0 2.8rem;
        }

        .feature-item {
            background: rgba(255, 255, 255, 0.6);
            border-radius: var(--radius-md);
            padding: 1.5rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 2px 8px rgba(0, 20, 10, 0.02);
            transition: background 0.2s ease, border-color 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--border-light);
        }

        .feature-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.2rem;
            color: white;
        }

        .feature-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .feature-item h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
        }

        .feature-item p {
            font-size: 0.9rem;
            color: #3b5f6e;
            line-height: 1.5;
        }

        /* 行动区域 (按钮 + 命令行) */
        .action-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-light);
            padding-top: 2rem;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.9rem 1.8rem;
            border-radius: 100px;
            font-weight: 500;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
            background: transparent;
            font-family: inherit;
            letter-spacing: -0.01em;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            box-shadow: 0 6px 14px -4px rgba(42, 127, 110, 0.3);
        }

        .btn-primary:hover {
            background: #1f6658;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(42, 127, 110, 0.4);
        }

        .btn-primary svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        .btn-outline {
            background: transparent;
            border: 1.5px solid rgba(42, 127, 110, 0.3);
            color: var(--accent);
        }

        .btn-outline:hover {
            background: rgba(42, 127, 110, 0.05);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .btn-outline svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* 命令行盒子 — 简洁的复制样式 */
        .cli-box {
            display: flex;
            align-items: center;
            background: rgba(26, 46, 59, 0.04);
            border-radius: 100px;
            padding: 0.3rem 0.3rem 0.3rem 1.5rem;
            border: 1px solid var(--border-light);
            font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-secondary);
            backdrop-filter: blur(5px);
            flex: 1;
            min-width: 240px;
        }

        .cli-box code {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 0.5rem;
        }

        .copy-btn {
            background: white;
            border: none;
            border-radius: 100px;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--accent);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(42, 127, 110, 0.15);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .copy-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
        }

        /* 底部微小的开源信息 */
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #6f8f9c;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.8;
        }

        .footer-note a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px dotted var(--accent-soft);
        }

        .footer-note a:hover {
            border-bottom-style: solid;
        }

        /* 复制反馈的小动画 */
        .copy-feedback {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text-primary);
            color: white;
            padding: 0.7rem 1.5rem;
            border-radius: 100px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            box-shadow: 0 10px 20px -8px rgba(0,0,0,0.3);
            z-index: 999;
            font-weight: 500;
        }

        .copy-feedback.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 响应式优化 */
        @media (max-width: 600px) {
            .open-source-card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }

            .title-section h1 {
                font-size: 2rem;
            }

            .subhead {
                font-size: 1rem;
                padding-left: 0.8rem;
            }

            .action-area {
                flex-direction: column;
                align-items: stretch;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                justify-content: center;
            }

            .cli-box {
                min-width: auto;
            }

            .badge, .stars {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="open-source-card">
        <!-- 头部：徽章 + 星标 -->
        <div class="card-header">
            <div class="badge">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                </svg>
                Open Source · MIT
            </div>
            <div class="stars">
                ★ 2.4k <span>stars</span>
            </div>
        </div>

        <!-- 主标题区域 -->
        <div class="title-section">
            <h1>
                <span class="accent-dot"></span> 
                开源 · 极简启动页
            </h1>
            <p class="subhead">
                一个干净、快速、无障碍的 HTML 模板 —— 为你的下一个开源项目而生。
            </p>
        </div>

        <!-- 特性卡片网格 -->
        <div class="features-grid">
            <div class="feature-item">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <h3>零依赖</h3>
                <p>纯 HTML + CSS，无 JavaScript 框架，开箱即用。</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                <h3>响应式</h3>
                <p>移动优先，在任何屏幕上都保持优雅与可读。</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <h3>开发者友好</h3>
                <p>清晰的代码结构，易于定制和扩展。</p>
            </div>
        </div>

        <!-- 行动区域: 按钮 + 命令行 -->
        <div class="action-area">
            <div class="buttons">
                <a href="#" class="btn btn-primary" onclick="alert('欢迎克隆或 fork 本项目 🎉'); return false;">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 4v16h16V4H4z"/>
                        <path d="M8 12h8M12 8v8"/>
                    </svg>
                    克隆仓库
                </a>
                <a href="#" class="btn btn-outline" onclick="alert('这是一个开源演示页面，欢迎查看源码。'); return false;">
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 16v-4M12 8h.01"/>
                    </svg>
                    了解更多
                </a>
            </div>

            <!-- 命令行 + 复制按钮 -->
            <div class="cli-box">
                <code id="cloneCommand">git clone https://github.com/yourname/open-start.git</code>
                <button class="copy-btn" id="copyButton" aria-label="复制命令">
                    <svg viewBox="0 0 24 24">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    复制
                </button>
            </div>
        </div>

        <!-- 底部开源信息 -->
        <div class="footer-note">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                <path d="M12 16v-4M12 8h.01"/>
            </svg>
            <span>MIT Licensed · 自由使用 · 由开源社区驱动</span>
        </div>
    </div>

    <!-- 复制反馈提示 -->
    <div id="copyFeedback" class="copy-feedback">📋 命令已复制到剪贴板</div>

    <!-- 仅用于复制功能的轻量脚本 -->
    <script>
        (function() {
            const copyButton = document.getElementById('copyButton');
            const cloneCommand = document.getElementById('cloneCommand');
            const feedback = document.getElementById('copyFeedback');

            // 复制功能
            async function copyCommand() {
                const textToCopy = cloneCommand.innerText.trim();
                try {
                    await navigator.clipboard.writeText(textToCopy);
                    showFeedback('📋 命令已复制到剪贴板');
                } catch (err) {
                    // fallback 方法（老旧浏览器）
                    const textArea = document.createElement('textarea');
                    textArea.value = textToCopy;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    showFeedback('📋 命令已复制');
                }
            }

            function showFeedback(message) {
                feedback.textContent = message;
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2000);
            }

            copyButton.addEventListener('click', copyCommand);

            // 让按钮上的 svg 也能触发点击（如果直接点击在 svg 上）
            copyButton.querySelector('svg')?.addEventListener('click', (e) => {
                e.stopPropagation();
                copyCommand();
            });
        })();
    </script>
</body>
</html>
