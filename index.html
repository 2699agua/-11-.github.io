<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: #ffffff;
            width: 360px;
            padding: 35px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 28px;
            color: #333;
        }
        .input-item {
            margin-bottom: 20px;
        }
        .input-item label {
            display: block;
            margin-bottom: 6px;
            color: #555;
        }
        .input-item input {
            width: 100%;
            height: 42px;
            padding: 0 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 15px;
        }
        .input-item input:focus {
            outline: none;
            border-color: #409eff;
        }
        #loginBtn {
            width: 100%;
            height: 44px;
            background-color: #409eff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        #loginBtn:hover {
            background-color: #66b1ff;
        }
        .tip {
            margin-top:16px;
            text-align:center;
            color:#888;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>用户登录</h2>
        <div class="input-item">
            <label>账号</label>
            <input type="text" id="username" placeholder="请输入账号">
        </div>
        <div class="input-item">
            <label>密码</label>
            <input type="password" id="password" placeholder="请输入密码">
        </div>
        <button id="loginBtn">登录</button>
        <div class="tip">测试账号：admin 密码：123456</div>
    </div>

    <script>
        const loginBtn = document.getElementById('loginBtn');
        loginBtn.addEventListener('click',function(){
            let username = document.getElementById('username').value;
            let password = document.getElementById('password').value;

            // 前端模拟校验
            if(username === '' || password === ''){
                alert('账号和密码不能为空！');
                return;
            }
            if(username === 'admin' && password === '123456'){
                alert('登录成功！');
                // 登录成功可以跳转页面
                // window.location.href = 'index.html';
            }else{
                alert('账号或者密码错误');
            }
        })
    </script>
</body>
</html>
